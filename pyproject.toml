[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ablation-tools"
version = "0.1.0"
description = "Model-agnostic reference implementations and methodology for ablation studies"
readme = "README.md"
authors = [{name = "Zhonghao Yan"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
visualization = [
    "Pillow>=9.0",
]
grounding-dino = [
    "Pillow>=9.0",
    "transformers>=4.57.1,<5",
]
dimensionality-reduction = [
    "scikit-learn>=1.5,<2",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["General*", "MLLM*", "Embodied*", "Metrics*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
